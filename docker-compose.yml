services:
  excalihub:
    build: .
    ports:
      - "80:80"
    environment:
      - PORT=80
      - HOST=0.0.0.0
      - BASE_DOMAIN=example.com
      - EXCALIDRAW_CONTAINER=http://excalidraw:80
      - DATA_DIR=/data
    volumes:
      - excalihub-data:/data
    depends_on:
      - excalidraw
    restart: unless-stopped

  excalidraw:
    image: excalidraw/excalidraw:latest
    expose:
      - "80"
    restart: unless-stopped

volumes:
  excalihub-data:
