name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly Excalidraw "latest" canary (non-blocking).
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test server/tests/

  # Deterministic gate: pinned Excalidraw digest (docker-compose.e2e.yml
  # default), all three browsers. Runs on PRs and manual dispatch.
  e2e:
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      E2E_GIT_REPO: jlai403/excalihub-ci
      E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      # test:e2e:docker builds the image (compose build in globalSetup) and runs
      # the suite against the container, so it doubles as the image build gate.
      - run: bun run test:e2e:docker
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results/

  # Non-blocking canary: does the newest Excalidraw still work? Chromium only,
  # scheduled/manual, and never fails the workflow — instead it files an issue
  # so upstream breakage leaves a durable trail.
  e2e-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-latest
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      EXCALIDRAW_IMAGE: excalidraw/excalidraw:latest
      E2E_GIT_REPO: jlai403/excalihub-ci
      E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - id: canary
        continue-on-error: true
        run: bun run test:e2e:docker:chromium
      - uses: actions/upload-artifact@v7
        if: steps.canary.outcome == 'failure'
        with:
          name: playwright-report-canary
          path: tests/e2e/test-results/
      - if: steps.canary.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Excalidraw `latest` canary failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The non-blocking canary run against \`excalidraw/excalidraw:latest\` failed.\n\nRun: ${run}\n\nUpstream likely changed something ExcaliHub depends on (DOM selectors, IndexedDB schema, injected-script hooks). Investigate, then bump the pinned digest in \`docker-compose.e2e.yml\` once fixed.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "excalidraw-canary",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["excalidraw-canary"],
              });
            }

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: immanuwell/dockerfile-roast@1.4.7
        with:
          files: Dockerfile
          min-severity: info
